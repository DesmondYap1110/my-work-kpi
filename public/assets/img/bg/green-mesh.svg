<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Soft green gradient mesh with glowing blobs and a faint dot grid - login background. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.5" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#0b3d2a"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="90"/></filter>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#d9f99d" opacity="0.18"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#soft)">
    <circle cx="300" cy="250" r="360" fill="#16a34a" opacity="0.55"/>
    <circle cx="1650" cy="180" r="300" fill="#a3e635" opacity="0.30"/>
    <circle cx="1400" cy="900" r="420" fill="#059669" opacity="0.50"/>
    <circle cx="520" cy="960" r="300" fill="#22c55e" opacity="0.30"/>
  </g>
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#fade)"/>
</svg>
