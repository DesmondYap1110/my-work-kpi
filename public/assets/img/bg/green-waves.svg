<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Deep green night sky with layered flowing waves - login background for the green themes. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0f5a3a"/>
      <stop offset="0.55" stop-color="#073324"/>
      <stop offset="1" stop-color="#021a12"/>
    </radialGradient>
    <linearGradient id="w1" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22a65e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#059669" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14532d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#022c22" stop-opacity="1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1480" cy="260" r="260" fill="#a3e635" opacity="0.10" filter="url(#blur)"/>
  <circle cx="380" cy="360" r="320" fill="#22a65e" opacity="0.14" filter="url(#blur)"/>
  <path d="M0 640 C 320 560 560 740 900 660 S 1500 520 1920 610 L1920 1080 L0 1080 Z" fill="url(#w1)"/>
  <path d="M0 740 C 280 690 620 840 980 760 S 1560 650 1920 730 L1920 1080 L0 1080 Z" fill="url(#w2)"/>
  <path d="M0 850 C 360 800 700 930 1060 860 S 1620 780 1920 840 L1920 1080 L0 1080 Z" fill="url(#w3)"/>
  <g fill="none" stroke="#a3e635" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M0 600 C 320 520 560 700 900 620 S 1500 480 1920 570"/>
    <path d="M0 700 C 280 650 620 800 980 720 S 1560 610 1920 690" stroke="#34d399" stroke-opacity="0.3"/>
  </g>
